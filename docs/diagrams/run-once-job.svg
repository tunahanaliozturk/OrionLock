<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="564" viewBox="0 0 1200 564">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="564" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionLock - run a scheduled job on one replica</text>
  <text class="subtitle" x="40" y="78">Every replica wakes on its schedule and makes one attempt; only the one that gets the lock runs the job.</text>

  <!-- wake -->
  <rect class="step" x="40" y="210" width="200" height="72" rx="14"/>
  <text class="label" x="140" y="242" text-anchor="middle">Replica wakes</text>
  <text class="small" x="140" y="264" text-anchor="middle">scheduled tick</text>

  <path class="flow" d="M240,246 L318,246"/>

  <!-- decision -->
  <polygon class="decision" points="440,170 560,246 440,322 320,246"/>
  <text class="code" x="440" y="242" text-anchor="middle">TryAcquireAsync</text>
  <text class="small" x="440" y="262" text-anchor="middle">"settlement:daily"</text>

  <!-- skip path -->
  <path class="flow alt" d="M440,170 L440,130 L638,130"/>
  <text class="edge" x="540" y="120" text-anchor="middle">null: another replica holds it</text>
  <rect class="fail" x="640" y="98" width="220" height="64" rx="14"/>
  <text class="label" x="750" y="126" text-anchor="middle">Skip this tick</text>
  <text class="small" x="750" y="146" text-anchor="middle">log it, no exception</text>
  <path class="flow" d="M860,130 L1180,130 L1180,502 L1142,502"/>

  <!-- run path -->
  <path class="flow" d="M560,246 L638,246"/>
  <text class="edge" x="599" y="236" text-anchor="middle">handle</text>
  <rect class="step" x="640" y="210" width="220" height="72" rx="14"/>
  <text class="label" x="750" y="242" text-anchor="middle">Run the job body</text>
  <text class="small" x="750" y="264" text-anchor="middle">pass handle.LostToken down</text>

  <path class="flow" d="M860,246 L918,246"/>
  <rect class="ok" x="920" y="210" width="220" height="72" rx="14"/>
  <text class="label" x="1030" y="242" text-anchor="middle">await using ends</text>
  <text class="small" x="1030" y="264" text-anchor="middle">DisposeAsync releases the lock</text>

  <!-- lease lost mid-job -->
  <path class="flow alt" d="M750,282 L750,358"/>
  <text class="edge" x="760" y="326">lease lost</text>
  <rect class="fail" x="640" y="360" width="220" height="72" rx="14"/>
  <text class="label" x="750" y="392" text-anchor="middle">Stop writing</text>
  <text class="small" x="750" y="414" text-anchor="middle">LostToken was cancelled</text>
  <path class="flow alt" d="M860,396 L980,396 L980,284"/>

  <!-- sleep -->
  <path class="flow" d="M1080,282 L1080,468"/>
  <rect class="step" x="920" y="470" width="220" height="64" rx="14"/>
  <text class="label" x="1030" y="508" text-anchor="middle">Sleep until next tick</text>

  <path class="flow" d="M920,502 L140,502 L140,284"/>
</svg>
