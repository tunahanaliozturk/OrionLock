<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="950" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionLock - acquire, renew, release</text>
  <text class="subtitle" x="40" y="78">One acquire attempt, a backend wait for the rest of WaitTimeout, a watchdog that renews the lease, and an owner-checked release.</text>

  <!-- participants -->
  <rect class="step" x="40" y="104" width="200" height="60" rx="12"/>
  <text class="label" x="140" y="132" text-anchor="middle">Your code</text>
  <text class="small" x="140" y="152" text-anchor="middle">critical section</text>

  <rect class="step" x="330" y="104" width="220" height="60" rx="12"/>
  <text class="label" x="440" y="132" text-anchor="middle">DistributedLock</text>
  <text class="code" x="440" y="152" text-anchor="middle">IDistributedLock</text>

  <rect class="step" x="640" y="104" width="240" height="60" rx="12"/>
  <text class="label" x="760" y="132" text-anchor="middle">Handle + lease watchdog</text>
  <text class="small" x="760" y="152" text-anchor="middle">one per acquired lock</text>

  <rect class="ext" x="940" y="104" width="240" height="60" rx="12"/>
  <text class="label" x="1060" y="132" text-anchor="middle">Backend</text>
  <text class="code" x="1060" y="152" text-anchor="middle">IDistributedLockProvider</text>

  <!-- renewal loop frame, drawn under the lifelines -->
  <rect class="note" x="100" y="590" width="1080" height="190" rx="10"/>

  <!-- lifelines -->
  <path class="lane" d="M140,164 L140,920"/>
  <path class="lane" d="M440,164 L440,920"/>
  <path class="lane" d="M760,164 L760,920"/>
  <path class="lane" d="M1060,164 L1060,920"/>

  <!-- 1 acquire -->
  <circle class="badge" cx="120" cy="206" r="11"/>
  <text class="badge-text" x="120" y="210" text-anchor="middle">1</text>
  <text class="code" x="290" y="200" text-anchor="middle">AcquireAsync("order:42", options)</text>
  <path class="flow" d="M140,212 L438,212"/>

  <!-- 2 single attempt -->
  <circle class="badge" cx="420" cy="252" r="11"/>
  <text class="badge-text" x="420" y="256" text-anchor="middle">2</text>
  <text class="code" x="750" y="246" text-anchor="middle">TryAcquireFencedAsync(key, ownerToken, LeaseDuration)</text>
  <path class="flow" d="M440,258 L1058,258"/>

  <circle class="badge" cx="1080" cy="298" r="11"/>
  <text class="badge-text" x="1080" y="302" text-anchor="middle">3</text>
  <text class="edge" x="750" y="292" text-anchor="middle">acquired (with FencingToken where the backend mints one), or held by another owner</text>
  <path class="flow back" d="M1060,304 L442,304"/>

  <!-- 4 wait -->
  <circle class="badge" cx="420" cy="344" r="11"/>
  <text class="badge-text" x="420" y="348" text-anchor="middle">4</text>
  <text class="code" x="750" y="338" text-anchor="middle">held: WaitForAcquireAsync(key, ownerToken, LeaseDuration, remaining)</text>
  <path class="flow" d="M440,350 L1058,350"/>
  <text class="small" x="750" y="372" text-anchor="middle">blocks in sp_getapplock or pg_advisory_lock, subscribes to a release channel, or polls</text>

  <circle class="badge" cx="1080" cy="408" r="11"/>
  <text class="badge-text" x="1080" y="412" text-anchor="middle">5</text>
  <text class="edge" x="900" y="402" text-anchor="middle">acquired</text>
  <path class="flow back" d="M1060,414 L442,414"/>

  <!-- acquire failure -->
  <text class="edge" x="290" y="446" text-anchor="middle">WaitTimeout spent, no grant:</text>
  <text class="code" x="290" y="466" text-anchor="middle" style="fill: #dc2626">LockAcquisitionTimeoutException</text>
  <path class="flow alt" d="M440,476 L142,476"/>

  <!-- 6 start watchdog -->
  <circle class="badge" cx="420" cy="516" r="11"/>
  <text class="badge-text" x="420" y="520" text-anchor="middle">6</text>
  <text class="edge" x="600" y="510" text-anchor="middle">new handle, watchdog starts</text>
  <path class="flow" d="M440,522 L758,522"/>

  <!-- 7 handle returned -->
  <circle class="badge" cx="460" cy="562" r="11"/>
  <text class="badge-text" x="460" y="566" text-anchor="middle">7</text>
  <text class="edge" x="290" y="556" text-anchor="middle">handle: IsHeld = true, LostToken open</text>
  <path class="flow back" d="M440,568 L142,568"/>

  <!-- renewal loop -->
  <text class="small" x="460" y="612">loop every LeaseDuration / 3 while held</text>

  <circle class="badge" cx="740" cy="642" r="11"/>
  <text class="badge-text" x="740" y="646" text-anchor="middle">8</text>
  <text class="code" x="910" y="636" text-anchor="middle">TryRenewAsync(key, ownerToken)</text>
  <path class="flow" d="M760,648 L1058,648"/>

  <circle class="badge" cx="1080" cy="688" r="11"/>
  <text class="badge-text" x="1080" y="692" text-anchor="middle">9</text>
  <text class="edge" x="910" y="682" text-anchor="middle">true: lease extended</text>
  <path class="flow back" d="M1060,694 L762,694"/>

  <text class="edge" x="600" y="710" text-anchor="middle" style="fill: #dc2626">false, or failing past</text>
  <text class="edge" x="600" y="727" text-anchor="middle" style="fill: #dc2626">RenewalFailureGracePeriod:</text>
  <text class="edge" x="600" y="744" text-anchor="middle" style="fill: #dc2626">IsHeld = false, LostToken cancelled</text>
  <path class="flow alt" d="M760,758 L142,758"/>

  <!-- 10 dispose -->
  <circle class="badge" cx="118" cy="826" r="11"/>
  <text class="badge-text" x="118" y="830" text-anchor="middle">10</text>
  <text class="code" x="600" y="814" text-anchor="middle">await handle.DisposeAsync()</text>
  <path class="flow" d="M140,826 L758,826"/>

  <!-- 11 release -->
  <circle class="badge" cx="740" cy="866" r="11"/>
  <text class="badge-text" x="740" y="870" text-anchor="middle">11</text>
  <text class="code" x="910" y="860" text-anchor="middle">ReleaseAsync(key, ownerToken)</text>
  <path class="flow" d="M760,872 L1058,872"/>
  <text class="small" x="910" y="896" text-anchor="middle">frees the lock only while ownerToken still owns it</text>
</svg>
