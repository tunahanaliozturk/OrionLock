<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="840" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionLock - packages and how the app reaches them</text>
  <text class="subtitle" x="40" y="78">Your code talks to the core; exactly one backend, registered with a Use* call, implements IDistributedLockProvider underneath it.</text>

  <!-- row 1: app, core, telemetry -->
  <rect class="step" x="40" y="110" width="290" height="130" rx="14"/>
  <text class="label" x="185" y="142" text-anchor="middle">Your app</text>
  <text class="code" x="60" y="172">AddOrionLock().UseRedis(...)</text>
  <text class="code" x="60" y="196">AcquireAsync / TryAcquireAsync</text>
  <text class="code" x="60" y="220">await using var handle</text>

  <path class="flow" d="M330,175 L388,175"/>
  <text class="edge" x="359" y="165" text-anchor="middle">calls</text>

  <rect class="step" x="390" y="110" width="420" height="210" rx="14"/>
  <text class="label" x="600" y="140" text-anchor="middle">OrionLock (core)</text>
  <text class="code" x="410" y="170">IDistributedLock, ISharedExclusiveLock</text>
  <text class="code" x="410" y="194">DistributedLockOptions</text>
  <text class="code" x="410" y="218">IDistributedLockHandle</text>
  <text class="small" x="430" y="240">IsHeld, LostToken, FencingToken, ThrowIfLost()</text>
  <text class="small" x="410" y="266">lease watchdog: renews every LeaseDuration / 3</text>
  <text class="code" x="410" y="296">IDistributedLockProvider</text>
  <text class="small" x="610" y="296">(backend contract)</text>

  <path class="flow" d="M810,175 L888,175"/>
  <text class="edge" x="849" y="165" text-anchor="middle">emits</text>

  <rect class="ext" x="890" y="110" width="270" height="110" rx="14"/>
  <text class="label" x="1025" y="142" text-anchor="middle">OpenTelemetry</text>
  <text class="code" x="1025" y="168" text-anchor="middle">Moongazing.OrionLock</text>
  <text class="small" x="1025" y="192" text-anchor="middle">ActivitySource + Meter</text>
  <text class="small" x="1025" y="210" text-anchor="middle">orion.lock.* instruments</text>

  <!-- published backends -->
  <path class="flow" d="M600,360 L600,322"/>
  <text class="edge" x="612" y="346">implements IDistributedLockProvider</text>

  <rect class="note" x="30" y="360" width="1140" height="250" rx="12"/>
  <text class="label" x="50" y="386">Published on nuget.org, version 3.0.0</text>

  <rect class="step" x="40" y="400" width="200" height="110" rx="14"/>
  <text class="label" x="140" y="430" text-anchor="middle">OrionLock.Redis</text>
  <text class="code" x="140" y="456" text-anchor="middle">UseRedis(...)</text>
  <text class="small" x="140" y="478" text-anchor="middle">SET NX PX + Lua scripts</text>
  <text class="small" x="140" y="496" text-anchor="middle">TTL lease</text>

  <rect class="step" x="255" y="400" width="200" height="110" rx="14"/>
  <text class="label" x="355" y="430" text-anchor="middle">OrionLock.Postgres</text>
  <text class="code" x="355" y="456" text-anchor="middle">UsePostgres(...)</text>
  <text class="small" x="355" y="478" text-anchor="middle">pg_advisory_lock</text>
  <text class="small" x="355" y="496" text-anchor="middle">session-scoped</text>

  <rect class="step" x="470" y="400" width="200" height="110" rx="14"/>
  <text class="label" x="570" y="430" text-anchor="middle">OrionLock.SqlServer</text>
  <text class="code" x="570" y="456" text-anchor="middle">UseSqlServer(...)</text>
  <text class="small" x="570" y="478" text-anchor="middle">sp_getapplock</text>
  <text class="small" x="570" y="496" text-anchor="middle">session-scoped</text>

  <rect class="step" x="685" y="400" width="280" height="110" rx="14"/>
  <text class="label" x="825" y="430" text-anchor="middle">OrionLock.EntityFrameworkCore</text>
  <text class="code" x="825" y="456" text-anchor="middle">UseEntityFrameworkCore&lt;T&gt;()</text>
  <text class="small" x="825" y="478" text-anchor="middle">OrionLock_Locks table</text>
  <text class="small" x="825" y="496" text-anchor="middle">TTL lease on the database clock</text>

  <rect class="step" x="980" y="400" width="180" height="110" rx="14"/>
  <text class="label" x="1070" y="430" text-anchor="middle">OrionLock.Testing</text>
  <text class="code" x="1070" y="456" text-anchor="middle">UseInMemory()</text>
  <text class="small" x="1070" y="478" text-anchor="middle">in-process</text>
  <text class="small" x="1070" y="496" text-anchor="middle">for tests</text>

  <!-- stores -->
  <path class="flow" d="M140,510 L140,538"/>
  <path class="flow" d="M355,510 L355,538"/>
  <path class="flow" d="M570,510 L570,538"/>
  <path class="flow" d="M825,510 L825,538"/>
  <path class="flow" d="M1070,510 L1070,538"/>

  <rect class="ext" x="40" y="540" width="200" height="52" rx="12"/>
  <text class="label" x="140" y="571" text-anchor="middle">Redis</text>
  <rect class="ext" x="255" y="540" width="200" height="52" rx="12"/>
  <text class="label" x="355" y="571" text-anchor="middle">PostgreSQL</text>
  <rect class="ext" x="470" y="540" width="200" height="52" rx="12"/>
  <text class="label" x="570" y="571" text-anchor="middle">SQL Server</text>
  <rect class="ext" x="685" y="540" width="280" height="52" rx="12"/>
  <text class="label" x="825" y="571" text-anchor="middle">Any relational database</text>
  <rect class="ext" x="980" y="540" width="180" height="52" rx="12"/>
  <text class="label" x="1070" y="571" text-anchor="middle">Process memory</text>

  <!-- unpublished -->
  <rect class="note" x="30" y="640" width="1140" height="170" rx="12"/>
  <text class="label" x="50" y="666">Not published: version 0.7.0, no container test coverage yet (use by project reference)</text>

  <rect class="step" x="40" y="682" width="262" height="110" rx="14"/>
  <text class="label" x="171" y="712" text-anchor="middle">OrionLock.Consul</text>
  <text class="code" x="171" y="738" text-anchor="middle">UseConsul(address)</text>
  <text class="small" x="171" y="760" text-anchor="middle">session-bound KV entry</text>
  <text class="small" x="171" y="778" text-anchor="middle">Consul agent</text>

  <rect class="step" x="322" y="682" width="262" height="110" rx="14"/>
  <text class="label" x="453" y="712" text-anchor="middle">OrionLock.Etcd</text>
  <text class="code" x="453" y="738" text-anchor="middle">UseEtcd(connectionString)</text>
  <text class="small" x="453" y="760" text-anchor="middle">lease-bound key</text>
  <text class="small" x="453" y="778" text-anchor="middle">etcd v3 cluster</text>

  <rect class="step" x="604" y="682" width="262" height="110" rx="14"/>
  <text class="label" x="735" y="712" text-anchor="middle">OrionLock.ZooKeeper</text>
  <text class="code" x="735" y="738" text-anchor="middle">UseZooKeeper()</text>
  <text class="small" x="735" y="760" text-anchor="middle">ephemeral sequential znode</text>
  <text class="small" x="735" y="778" text-anchor="middle">ZooKeeper ensemble</text>

  <rect class="step" x="886" y="682" width="274" height="110" rx="14"/>
  <text class="label" x="1023" y="712" text-anchor="middle">OrionLock.HealthChecks</text>
  <text class="code" x="1023" y="738" text-anchor="middle">AddOrionLockHealthCheck()</text>
  <text class="small" x="1023" y="760" text-anchor="middle">acquires and releases a sentinel</text>
  <text class="small" x="1023" y="778" text-anchor="middle">on the registered backend</text>
</svg>
