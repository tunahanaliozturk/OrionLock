name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

# Least privilege by default: the only job that needs more says so itself.
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_PATH: Moongazing.OrionLock.sln
  AOT_SMOKE_PATH: tests/Moongazing.OrionLock.AotSmoke/Moongazing.OrionLock.AotSmoke.csproj

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job builds and runs code from the branch under test; leaving GITHUB_TOKEN in
          # .git/config would hand that code a credential it has no reason to hold.
          persist-credentials: false
      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release
      - name: Pre-pull SqlServer test image
        # The MsSqlBuilder default image lives on mcr.microsoft.com, whose anonymous-pull
        # quota throttles the shared runner IP pool (toomanyrequests). Testcontainers pulls
        # it at test time, so a throttle there fails the build. Pulling it here first, with
        # backoff, gives the registry time to recover and caches the image locally so the
        # test run does not touch MCR again. Best-effort: if MCR is genuinely down the tests
        # still run and report the real failure.
        run: |
          image=mcr.microsoft.com/mssql/server:2022-latest
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              break
            fi
            echo "pull of $image failed (attempt $attempt/5); backing off"
            sleep $((attempt * 30))
          done
        continue-on-error: true
      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-restore --configuration Release --verbosity normal

  aot-smoke:
    # OrionLock's AOT exit criterion: a NativeAOT publish of the acquire/contend/release lifecycle
    # with zero trim/AOT warnings, and a native binary that exits 0.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Publish NativeAOT
        run: |
          dotnet publish ${{ env.AOT_SMOKE_PATH }} \
            --configuration Release \
            --runtime linux-x64 \
            --output ./aot-smoke \
            -warnaserror
      - name: Run the native binary
        run: ./aot-smoke/Moongazing.OrionLock.AotSmoke

  publish:
    needs: [build-and-test, aot-smoke]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      - name: Build
        # ContinuousIntegrationBuild maps source paths to /_/ and records the commit through
        # Source Link, so the shipped assemblies and PDBs are reproducible.
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release -p:ContinuousIntegrationBuild=true
      - name: Pack Packages
        run: |
          dotnet pack src/Moongazing.OrionLock/Moongazing.OrionLock.csproj --no-build --configuration Release -o ./nupkgs
          dotnet pack src/Moongazing.OrionLock.Redis/Moongazing.OrionLock.Redis.csproj --no-build --configuration Release -o ./nupkgs
          dotnet pack src/Moongazing.OrionLock.EntityFrameworkCore/Moongazing.OrionLock.EntityFrameworkCore.csproj --no-build --configuration Release -o ./nupkgs
          dotnet pack src/Moongazing.OrionLock.SqlServer/Moongazing.OrionLock.SqlServer.csproj --no-build --configuration Release -o ./nupkgs
          dotnet pack src/Moongazing.OrionLock.Postgres/Moongazing.OrionLock.Postgres.csproj --no-build --configuration Release -o ./nupkgs
          dotnet pack src/Moongazing.OrionLock.Testing/Moongazing.OrionLock.Testing.csproj --no-build --configuration Release -o ./nupkgs
      - name: Push to NuGet.org
        # The key goes through the environment rather than the command line, which every other
        # process on the runner can read.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET }}
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate --timeout 900
      - name: Push to GitHub Packages
        # GitHub Packages does not honour --skip-duplicate like nuget.org: it exits non-zero on an
        # already-published version, which would fail the run on a re-publish even though the
        # nuget.org push above (the gating one) succeeded. Rather than continue-on-error, which also
        # hides a real auth or upload failure and lets the mirror silently drift, tolerate ONLY the
        # duplicate rejection. 300s (the default) is per package and a large one on a slow mirror day
        # exceeds it.
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          dotnet nuget add source --username "$REPOSITORY_OWNER" --password "$GITHUB_PACKAGES_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/$REPOSITORY_OWNER/index.json"
          # Pushed one package at a time on purpose. GitHub Packages answers an already-published
          # version with 409 instead of honouring --skip-duplicate, and dotnet nuget push stops at the
          # first failure in a batch - so a retry of a partly-published release would abort on package
          # one and never attempt the rest, while a batch-level "it was only duplicates" check called
          # that success and left the mirror permanently incomplete. Per package, a duplicate is
          # tolerated and anything else fails the job, after every package has had its turn.
          failed=0
          for pkg in ./nupkgs/*.nupkg; do
            set +e
            output=$(dotnet nuget push "$pkg" --source github --api-key "$GITHUB_PACKAGES_TOKEN" --skip-duplicate --timeout 900 2>&1)
            code=$?
            set -e
            if [ $code -eq 0 ]; then
              continue
            fi
            if echo "$output" | grep -qiE 'already exists|already been pushed|409 \(Conflict\)'; then
              echo "already published, skipping: $(basename "$pkg")"
            else
              echo "$output"
              echo "::error::GitHub Packages push failed for $(basename "$pkg") (exit code $code)."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
